<svg width="440" height="140" viewBox="0 0 440 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Celiacos Guatemala — wordmark logo -->
  <!-- Palette preserved from source: charcoal #262529, orange accent #FF8029 -->

  <!-- Wheat-spike mark (echoes the original leading "G"/leaf motif) -->
  <g>
    <!-- central stalk -->
    <path d="M30 96 C30 70 30 48 30 30" stroke="#262529" stroke-width="5" stroke-linecap="round"/>
    <!-- grains, alternating, with one orange accent -->
    <path d="M30 38 C22 33 18 27 18 20 C26 22 30 28 30 36 Z" fill="#262529"/>
    <path d="M30 38 C38 33 42 27 42 20 C34 22 30 28 30 36 Z" fill="#FF8029"/>
    <path d="M30 52 C21 47 16 41 16 33 C25 35 30 41 30 50 Z" fill="#262529"/>
    <path d="M30 52 C39 47 44 41 44 33 C35 35 30 41 30 50 Z" fill="#262529"/>
    <path d="M30 66 C20 61 14 55 14 46 C24 48 30 54 30 64 Z" fill="#262529"/>
    <path d="M30 66 C40 61 46 55 46 46 C36 48 30 54 30 64 Z" fill="#262529"/>
    <!-- base leaf -->
    <path d="M14 100 H50 C50 92 43 86 35 86 H14 Z" fill="#FF8029"/>
  </g>

  <!-- Primary wordmark: CELIACOS -->
  <text x="74" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#262529">Celiacos</text>

  <!-- Secondary line: GUATEMALA (orange, tracked-out) -->
  <text x="78" y="98" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="6.5" fill="#FF8029">GUATEMALA</text>
</svg>
